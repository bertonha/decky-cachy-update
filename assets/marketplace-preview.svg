  <text x="170" y="499" fill="#c6d0d7" font-family="ui-monospace, monospace" font-size="23">:: Processing package changes</text>
  <text x="136" y="604" fill="#a9b5ad" font-family="system-ui, sans-serif" font-size="24">Run updates and follow real-time output without leaving Gaming Mode.</text>
