<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">CachyOS Update for Decky Loader</title>
  <desc id="desc">A Decky Quick Access Menu panel for running cachy-update and following its live output.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#121820"/>
      <stop offset="1" stop-color="#243b2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#83e15b"/>
      <stop offset="1" stop-color="#b7f26b"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <rect x="72" y="66" width="1136" height="588" rx="30" fill="#0d1218" stroke="#385147" stroke-width="2"/>
  <rect x="72" y="66" width="16" height="588" rx="8" fill="url(#accent)"/>
  <circle cx="154" cy="152" r="38" fill="#1b3524" stroke="#83e15b" stroke-width="3"/>
  <path d="M137 153h34M154 136v34" stroke="#b7f26b" stroke-width="7" stroke-linecap="round"/>
  <text x="218" y="142" fill="#f4f7f3" font-family="system-ui, sans-serif" font-size="48" font-weight="700">CachyOS Update</text>
  <text x="220" y="188" fill="#a9b5ad" font-family="system-ui, sans-serif" font-size="25">Decky Loader · Quick Access Menu</text>
